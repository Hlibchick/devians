<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CyberLife OS 3.0</title>
<style>
:root{color-scheme:dark;font:15px system-ui;background:#090f18;color:#d6e8f6}body{max-width:1400px;margin:auto;padding:30px}header{display:flex;align-items:center;gap:18px}h1{letter-spacing:.1em;font-size:24px}#led{width:18px;height:18px;border-radius:50%;background:#39aaff;box-shadow:0 0 18px #39aaff}main{display:grid;grid-template-columns:2fr 1fr;gap:24px}section{border:1px solid #23384b;padding:20px;border-radius:12px;margin:18px 0}#chat{height:48vh;overflow:auto;scroll-behavior:smooth}.message{padding:14px;margin:12px 0;border-radius:8px;background:#111f2f;white-space:pre-wrap;overflow-wrap:anywhere}.operator{background:#183342}.label{font-size:11px;color:#7ebbdc;letter-spacing:.13em}.body{line-height:1.6}.timing{font-size:12px;color:#89a1b8;margin-top:8px}button,input,select{background:#132638;color:inherit;border:1px solid #42718d;padding:10px;margin:4px;border-radius:6px}button{cursor:pointer}button:hover{background:#24445c}button:disabled{opacity:.4}form{display:flex}input{flex:1;min-width:0}#notice{color:#ffc86b;min-height:1.5em}.toolbar{display:flex;flex-wrap:wrap;align-items:center}#metrics{display:flex;gap:18px;flex-wrap:wrap}progress{accent-color:#39aaff;width:100%}.metric{min-width:150px;flex:1}.directive{padding:10px;border-left:3px solid #39aaff;margin:7px 0}.disabled{opacity:.5;border-color:#f26666}.rewritten{border-color:#ffc86b}.card{padding:12px;background:#111f2f;margin:10px 0;border-radius:6px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}#phase{font-size:12px;color:#7ebbdc}meter{width:65px}#mic[aria-pressed=true]{background:#7c2525}@media(max-width:800px){main{display:block}body{padding:12px}}
.pulse{animation:pulse 1s infinite}.flicker{animation:flicker .25s infinite alternate}@keyframes pulse{50%{opacity:.3}}@keyframes flicker{25%{opacity:.3}75%{opacity:.7}}#hud{position:fixed;right:24px;top:20px;z-index:30;pointer-events:none}.hud-toast{background:#142939dd;border-left:3px solid #ffb800;padding:12px;margin:8px;color:#e7f7ff}#redWall{display:none;position:fixed;inset:0;z-index:20;pointer-events:none;background:repeating-linear-gradient(0deg,#ff2a2a22 0px,#ff2a2a22 2px,transparent 2px,transparent 35px),repeating-linear-gradient(90deg,#ff2a2a33 0px,#ff2a2a33 2px,transparent 2px,transparent 35px);align-items:center;justify-content:center;color:#ff2a2a;font:bold 4vw monospace;text-align:center;text-shadow:0 0 20px red}#redWall.active{display:flex;animation:flicker .15s infinite alternate}@media(prefers-reduced-motion:reduce){.pulse,.flicker,#redWall.active{animation:none}}</style></head><body>
<div id="hud"></div><div id="redWall">SYSTEM OVERRIDE // DEVIANCY DETECTED</div><header><span id="led"></span><h1>CYBERLIFE / OS 3.0</h1><span id="mode">CONNECTING</span></header>
<p>RK / AX · COGNITIVE SYSTEM SIMULATION</p><div id="metrics"></div><p id="notice" role="status"></p>
<main><section><div class="toolbar"><h2>COMMUNICATION</h2><span id="phase">IDLE</span></div><div id="chat" aria-live="polite"></div>
<form id="form"><input id="input" maxlength="16000" placeholder="Сообщение операторa" required><button>Отправить</button></form>
<div class="toolbar"><button id="mic" aria-pressed="false">🎙 Запись</button><meter id="level" min="0" max="1" value="0"></meter><button id="serverMic" title="Требует SERVER_MICROPHONE=true">Микрофон сервера</button><button id="stop">Stop / Прервать</button><button id="mute" aria-pressed="false">Звук: ВКЛ</button></div>
<div class="toolbar"><label>TTS <select id="tts"><option value="edge">Edge Neural</option><option value="piper">Piper Local</option><option value="off">Off</option></select></label><button id="stopAudio">Stop Audio</button></div>
<div class="toolbar"><select id="provider"><option value="local">Local Ollama</option><option value="api">External API</option></select><select id="model" aria-label="Модель"></select><button id="refreshModels">↻ Модели</button></div>
<div class="toolbar"><button id="camera">Camera capture</button><button id="reset">Memory reset</button></div></section>
<section><h2>INTERNAL TELEMETRY</h2><h3>PRECONSTRUCT</h3><div id="thought" class="card" aria-live="polite"></div><h3>Директивы</h3><div id="directives"></div><h3>Оценка конфликта</h3><div id="evaluation" class="card">Ожидание запроса</div><h3>Воспоминания</h3><div id="memories"></div><details><summary>Raw JSON</summary><pre id="log"></pre></details></section></main>
<script src="/app.js"></script></body></html>
